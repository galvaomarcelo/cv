name: Generate Resume

on:
  push:
    paths:
      - 'assets/cv/resume_pt.json'   # Dispara apenas quando este arquivo for alterado
  workflow_dispatch:                  # Permite execução manual

permissions:
  contents: write                     # Necessário para enviar o PDF de volta

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. Gerar PDF (usando jsonresume-generator)
      - name: Generate PDF
        uses: Devleaps/jsonresume-generator@v1
        with:
          file: 'resume_pt.json'
          folder: 'assets/cv/'
          output-type: 'pdf'
          theme-name: 'jsonresume-theme-even'

      # 2. Gerar Markdown (usando resume-cli)
      - name: Install resume-cli
        run: npm install -g resume-cli

      - name: Generate Markdown
        run: |
          cd assets/cv
          resume export resume_pt.md --format md --theme even

      # 3. Enviar os arquivos gerados de volta para o repositório
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/cv/resume_pt.pdf assets/cv/resume_pt.md
          git diff --staged --quiet || git commit -m "chore: rebuild resume"
          git push
