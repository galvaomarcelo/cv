name: Generate Resume PDF

on:
  push:
    paths:
      - 'assets/cv/resume.json' # Só roda quando este arquivo for alterado
  workflow_dispatch: # Permite rodar o workflow manualmente também

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Resume PDF
        uses: Devleaps/jsonresume-generator@v1
        with:
          # Caminho para o seu arquivo JSON
          file: 'assets/cv/resume.json'
          # Pasta onde o PDF será salvo
          folder: 'assets/cv/'
          # Nome do arquivo de saída
          output-type: 'pdf'
          # Um tema pronto (pode trocar depois)
          theme-name: 'jsonresume-theme-even'

      - name: Commit and push PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/cv/resume.pdf
          git diff --staged --quiet || git commit -m "Update resume PDF"
          git push
